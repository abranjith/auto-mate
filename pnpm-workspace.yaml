packages:
  - packages/*
allowBuilds:
  # Transitive dependencies of @earendil-works/pi-coding-agent. Their install
  # scripts are not needed for SDK-mode use, so they stay unbuilt.
  '@google/genai': false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.87.1'
  - '@earendil-works/pi-agent-core@0.87.1'
  - '@earendil-works/pi-ai@0.87.1'
  - '@earendil-works/pi-coding-agent@0.87.1'
  - '@earendil-works/pi-telemetry@0.87.1'
  - '@earendil-works/pi-tui@0.87.1'
